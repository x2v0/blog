<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обсуждение — Блог</title>
    <style>
        :root { --bg: #f5f3eb; --text: #333; --card-bg: #fff; --border: #ddd; --accent: #0288d1; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --border: #333; --accent: #4fc3f7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { font-family: monospace; font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
        .post-title { font-size: 20px; margin-bottom: 20px; color: var(--accent); }
        #giscus-container { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="back-link">← Назад к блогу</a>
        <div class="header">Обсуждение</div>
        <div id="post-title" class="post-title">Загрузка...</div>
        <div id="giscus-container"></div>
    </div>

    <script>
        // Получаем ID поста из URL
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id') || 'unknown';
        const postTitle = urlParams.get('title') || 'Обсуждение';

        document.getElementById('post-title').textContent = decodeURIComponent(postTitle);

        // Загружаем Giscus
        const script = document.createElement('script');
        script.src = 'https://utteranc.es/client.js';
        script.setAttribute('repo', 'x2v0/x2v0.github.io');
        
        
        
        
        script.setAttribute('issue-term', postId);
        
        
        
        
        script.setAttribute('theme', 'preferred-color-scheme');
        
        script.setAttribute('crossorigin', 'anonymous');
        script.async = true;
        document.getElementById('giscus-container').appendChild(script);
    </script>
</body>
</html>
