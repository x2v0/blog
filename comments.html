<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обсуждение — Блог</title>
    <style>
        :root {
            --bg: #f5f3eb;
            --text: #333;
            --card-bg: #fff;
            --border: #ddd;
            --accent: #0288d1;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --border: #333;
            --accent: #4fc3f7;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { font-family: monospace; font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
        .post-title { font-size: 20px; margin-bottom: 20px; color: var(--accent); }
        #giscus-container { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); min-height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="back-link">← Назад к блогу</a>
        <div class="header">Обсуждение</div>
        <div id="post-title" class="post-title">Загрузка...</div>
        <div id="giscus-container"></div>
    </div>

    <script>
        // 1. Устанавливаем тему для СТРАНИЦЫ (и Giscus)
        var currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);

        // 2. Параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        let postId = urlParams.get('id') || 'unknown';
        const postTitle = urlParams.get('title') || 'Обсуждение';
        postId = postId.replace(/[^a-zA-Z0-9_-]/g, '');
        document.getElementById('post-title').textContent = decodeURIComponent(postTitle);

        // 3. Giscus с синхронизацией темы
        function loadGiscus(theme) {
            const container = document.getElementById('giscus-container');
            container.innerHTML = '';
            
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', 'x2v0/x2v0.github.io');
            script.setAttribute('data-repo-id', 'MDEwOlJlcG9zaXRvcnkzNDk0NTQ4NDc=');
            script.setAttribute('data-category', 'Blog comments');
            script.setAttribute('data-category-id', 'DIC_kwDOFNRB_84DJ5jS');
            script.setAttribute('data-mapping', 'specific');
            script.setAttribute('data-term', postId);
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', '1');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'bottom');
            script.setAttribute('data-theme', theme); // 'dark' или 'light'
            script.setAttribute('data-lang', 'ru');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
        }

        // Загружаем Giscus с текущей темой
        loadGiscus(currentTheme === 'dark' ? 'dark' : 'light');

        // Слушаем изменения темы (из других вкладок)
        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') {
                const newTheme = e.newValue || 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                loadGiscus(newTheme === 'dark' ? 'dark' : 'light');
            }
        });
    </script>
</body>
</html>
