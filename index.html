<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <script src="./marked.min.js">
        // Кнопка Наверх
        document.getElementById('scroll-top').addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

    </script>
    <style>
        :root {
            --bg: #f5f3eb;
            --text: #333;
            --card-bg: #fff;
            --border: #ddd;
            --accent: #0288d1;
            --fg2: #444;
            --fg3: #888;
            --code-bg: #f0f0f0;
            --code-text: #333;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --border: #333;
            --accent: #4fc3f7;
            --fg2: #b0b0b0;
            --fg3: #777;
            --code-bg: #282c34;
            --code-text: #e0e0e0;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { font-family: monospace; font-size: 32px; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
        .post-node { margin-bottom: 20px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--fg3); }
        .post-author { font-weight: bold; color: var(--text); }
        .post-subject { font-size: 18px; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .post-preview { font-size: 15px; line-height: 1.6; color: var(--fg2); }
        .post-full { display: none; font-size: 15px; line-height: 1.6; color: var(--fg2); }
        .post-full h1 { font-size: 24px; margin-top: 0; color: var(--text); }
        .post-full h2 { font-size: 20px; margin-top: 20px; color: var(--text); }
        .post-full h3 { font-size: 18px; margin-top: 15px; color: var(--text); }
        .post-full p { margin: 10px 0; }
        .post-full ul, .post-full ol { margin: 10px 0; padding-left: 20px; }
        .post-full a { color: var(--accent); font-weight: bold; }
        .post-full pre { background: var(--code-bg); color: var(--code-text); padding: 15px; border-radius: 8px; overflow-x: auto; font-family: monospace; font-size: 14px; }
        .post-full code { background: var(--code-bg); color: var(--code-text); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .post-full pre code { background: transparent; padding: 0; }
        .post-full blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: var(--fg3); margin: 10px 0; }
        .actions { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-top: 15px; }
        .btn-link { color: var(--accent); font-weight: bold; text-decoration: none; cursor: pointer; }
        .btn-link:hover { text-decoration: underline; }
        .icon-btn { font-size: 18px; text-decoration: none; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; }
        .icon-btn:hover { opacity: 1; }
        mark { background: #ffeb3b; color: #000; padding: 0 2px; border-radius: 2px; }

        
        
        
    
        #scroll-top {
            position: fixed !important;
            bottom: 80px !important;
            right: 20px !important;
            width: 50px !important;
            height: 50px !important;
            border-radius: 50% !important;
            background: #0288d1 !important;
            color: #ffffff !important;
            border: none !important;
            font-size: 24px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            display: block !important;
            z-index: 99999 !important;
            opacity: 0.7 !important;
            transition: opacity 0.2s !important;
        }
        #scroll-top:hover {
            opacity: 1 !important;
        }

    </style>
</head>
<body>
    <div class="container">
        <a href="https://x2v0.github.io/" class="back-link">← На главную</a>
        <div class="header">Блог</div>
        <input type="text" id="search-input" placeholder="🔍 Поиск..." style="width:100%; padding:15px; border:1px solid var(--border); border-radius:10px; font-size:16px; margin-bottom:20px; box-sizing:border-box; background:var(--card-bg); color:var(--text);">
        <div id="feed"><p>Загрузка...</p></div>
    </div>

    <button id="scroll-top" title="Наверх">↑</button>

    <script>
        // Тема
        var currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') document.documentElement.setAttribute('data-theme', e.newValue || 'light');
        });

        let allNodes = [];
        let query = '';

        // Загрузка с защитой от кэша
        fetch('./tree.json?v=' + Date.now())
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                allNodes = data;
                render(data);
            })
            .catch(err => {
                console.error('Ошибка загрузки:', err);
                document.getElementById('feed').innerHTML = '<p style="color:red;">Ошибка загрузки постов: ' + err.message + '</p>';
            });

        function render(nodes) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            if (nodes.length === 0) {
                feed.innerHTML = '<p>Ничего не найдено.</p>';
                return;
            }
            nodes.forEach((node, idx) => {
                const div = document.createElement('div');
                div.className = 'post-node';
                div.id = 'post-' + idx;

                // Очищаем превью от Markdown-заголовков
                const cleanBody = (node.body || '').replace(/^#+\s+/gm, '').replace(/\*\*/g, '');
                const preview = cleanBody.substring(0, 200) + '...';
                let fullHtml = node.body || '';
                if (typeof marked !== 'undefined') {
                    fullHtml = marked.parse(fullHtml);
                }

                div.innerHTML = `
                    <div class="post-header">
                        <span class="post-author">${node.from}</span>
                        <span>${node.date}</span>
                    </div>
                    <div class="post-subject">${highlight(node.subject, query)}</div>
                    <div class="post-preview" id="preview-${idx}">${highlight(preview, query)}</div>
                    <div class="post-full" id="full-${idx}">${fullHtml}</div>
                    <div class="actions">
                        <a href="#" class="btn-link" id="btn-${idx}" onclick="togglePost(event, ${idx})">Читать полностью →</a>
                        <a href="./comments.html?id=${node.id}&title=${encodeURIComponent(node.subject)}" class="btn-link" target="_blank">💬 Обсудить</a>
                        <a href="#" class="icon-btn" onclick="copyLink(event, '${node.id}'); return false;" title="Скопировать ссылку">🔗</a>
                        <a href="#" class="icon-btn" onclick="copyText(event, '${node.id}'); return false;" title="Скопировать текст">📋</a>
                    </div>
                `;
                feed.appendChild(div);
            });
        }

        function togglePost(e, idx) {
            e.preventDefault();
            const preview = document.getElementById('preview-' + idx);
            const full = document.getElementById('full-' + idx);
            const btn = document.getElementById('btn-' + idx);

            if (full.style.display === 'block') {
                full.style.display = 'none';
                preview.style.display = 'block';
                btn.textContent = 'Читать полностью →';
            } else {
                full.style.display = 'block';
                preview.style.display = 'none';
                btn.textContent = '← К списку статей';
            }
        }

        function copyLink(e, postId) {
            e.preventDefault();
            const url = window.location.origin + window.location.pathname.replace('index.html', '') + 'comments.html?id=' + postId;
            navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована!'));
        }

        function copyText(e, postId) {
            e.preventDefault();
            const node = allNodes.find(n => n.id === postId);
            if (!node) return;
            const text = `# ${node.subject}\n\n${node.body}`;
            navigator.clipboard.writeText(text).then(() => showToast('Текст поста скопирован!'));
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; z-index: 9999; font-size: 14px;';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function highlight(text, q) {
            if (!q) return text;
            const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp('(' + safeQ + ')', 'gi'), '<mark>$1</mark>');
        }

        document.getElementById('search-input').addEventListener('input', function(e) {
            query = e.target.value.trim();
            if (!query) { render(allNodes); return; }
            const filtered = allNodes.filter(n =>
                (n.subject || '').toLowerCase().includes(query.toLowerCase()) ||
                (n.body || '').toLowerCase().includes(query.toLowerCase())
            );
            render(filtered);
        });

        
    
        // Кнопка Наверх
        document.getElementById('scroll-top').addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

    </script>
</body>
</html>
