<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #1e1e1e;
            --surface: #252526;
            --text: #d4d4d4;
            --text-muted: #888;
            --accent: #0288d1;
            --border: #333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 400;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }
        .post-node {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .post-subject {
            font-size: 1.4rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .post-preview {
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .post-full {
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            margin-top: 15px;
        }
        .post-full img {
            max-width: 100%;
            border-radius: 4px;
        }
        .post-full a {
            color: var(--accent);
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .giscus-btn {
            background: #6e5494;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 15px;
        }
        .giscus-btn:hover { opacity: 0.9; color: white; }
        
        /* Плавающая кнопка админа */
        .admin-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: var(--surface);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        .admin-float a {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #6e5494;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .highlight {
            background-color: #ffeb3b;
            color: #000;
            border-radius: 2px;
        }
    
        .btn-github {
            background: #24292e;
            color: #ffffff !important;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-github:hover {
            background: #444;
            border-color: #666;
            color: #fff !important;
        }
        .btn-github svg {
            fill: currentColor;
        }
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Блог</h1>
        </header>
        
        <input type="text" id="search" class="search-box" placeholder="🔍 Поиск...">
        
        <div id="feed">
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        let allPosts = [];
        let currentQuery = '';

        // Функция подсветки поиска
        function highlight(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Функция копирования ссылки на пост
        function copyLink(e, postId) {
            e.preventDefault();
            let baseUrl = window.location.origin + window.location.pathname;
            if (baseUrl.endsWith('index.html')) baseUrl = baseUrl.replace('index.html', '');
            if (!baseUrl.endsWith('/')) baseUrl += '/';
            const url = baseUrl + '#' + postId;
            
            navigator.clipboard.writeText(url).then(() => {
                alert('Ссылка на статью скопирована!');
            }).catch(() => {
                prompt('Скопируйте ссылку вручную:', url);
            });
        }

        // Функция переключения полного текста
        function togglePost(idx) {
            const preview = document.getElementById(`preview-${idx}`);
            const full = document.getElementById(`full-${idx}`);
            const btn = document.getElementById(`toggle-btn-${idx}`);
            
            if (full.style.display === 'block') {
                full.style.display = 'none';
                preview.style.display = 'block';
                btn.innerText = 'Читать полностью';
            } else {
                full.style.display = 'block';
                preview.style.display = 'none';
                btn.innerText = 'Свернуть';
            }
        }

        // Рендер постов
        function render(nodes) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            if (nodes.length === 0) {
                feed.innerHTML = '<p>Ничего не найдено.</p>';
                return;
            }

            nodes.forEach((node, idx) => {
                const div = document.createElement('div');
                div.className = 'post-node';
                div.id = node.id;

                const cleanBody = (node.body || '').replace(/^#+\s+/gm, '').replace(/\*\*/g, '');
                const preview = cleanBody.substring(0, 200) + '...';
                let fullHtml = node.body || '';
                fullHtml = fullHtml.replace(/^#\s+.*$/m, '');
                
                if (typeof marked !== 'undefined') {
                    fullHtml = marked.parse(fullHtml);
                }

                div.innerHTML = `
                    <div class="post-header">
                        <span class="post-author">${node.from}</span>
                        <span>${node.date}</span>
                    </div>
                    <div class="post-subject">${highlight(node.subject, currentQuery)}</div>
                    <div class="post-preview" id="preview-${idx}">${highlight(preview, currentQuery)}</div>
                    <div class="post-full" id="full-${idx}">${fullHtml}</div>
                    <div class="actions">
                        <button class="btn" id="toggle-btn-${idx}" onclick="togglePost(${idx})">Читать полностью</button>
                        <button class="btn" onclick="copyLink(event, '${node.id}')">🔗 Поделиться</button>
                        <a href="comments.html?id=${node.id}" class="btn">💬 Комментарии</a>
                    </div>
                `;
                
                // Добавляем кнопку Giscus в админ-режиме
                if (window.location.search.includes('admin=1')) {
                    const adminBtn = document.createElement('div');
                    adminBtn.innerHTML = `<a href="https://github.com/x2v0/blog/discussions" target="_blank" class="giscus-btn">⚙️ Управление комментариями (GitHub)</a>`;
                    div.appendChild(adminBtn);
                }

                feed.appendChild(div);
            });
        }

        // Поиск
        document.getElementById('search').addEventListener('input', (e) => {
            currentQuery = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                (p.subject || '').toLowerCase().includes(currentQuery) || 
                (p.body || '').toLowerCase().includes(currentQuery)
            );
            render(filtered);
        });

        // Загрузка данных
        fetch('./tree.json?v=' + Date.now())
            .then(r => r.json())
            .then(data => {
                allPosts = data;
                render(data);

                // Авто-скролл и раскрытие, если есть хэш
                if (window.location.hash) {
                    const targetId = window.location.hash.substring(1);
                    setTimeout(() => {
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            targetEl.scrollIntoView({ behavior: 'smooth' });
                            const toggleBtn = targetEl.querySelector('.btn');
                            if (toggleBtn && toggleBtn.innerText.includes('Читать')) {
                                toggleBtn.click();
                            }
                        }
                    }, 300);
                }
            })
            .catch(err => {
                document.getElementById('feed').innerHTML = `<p style="color:red">Ошибка загрузки: ${err.message}</p>`;
            });

        // Плавающая кнопка админа
        if (window.location.search.includes('admin=1')) {
            const adminBar = document.createElement('div');
            adminBar.className = 'admin-float';
            adminBar.innerHTML = `
                <a href="https://github.com/x2v0/blog/discussions" target="_blank">
                    <svg height="20" viewBox="0 0 16 16" width="20" fill="currentColor"><path d="M1.75 1h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25v-8.5C0 1.784.784 1 1.75 1ZM1.5 2.75v8.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 .75.75v1.19l2.72-2.72a.75.75 0 0 1 .53-.22h5.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25Z"></path></svg>
                    Управление комментариями
                </a>
            `;
            document.body.appendChild(adminBar);
        }
    </script>
</body>
</html>
