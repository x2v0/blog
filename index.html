<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Валерий Онучин</title>
    <script src="./marked.min.js"></script>
    <style>
        :root {
            --code-bg: #f0f0f0;
            --code-text: #333;
            --bg: #f5f3eb;
            --text: #333;
            --card-bg: #fff;
            --border: #ddd;
            --accent: #0288d1;
            --fg2: #444;
            --fg3: #888;
        }
        [data-theme="dark"] {
            --code-bg: #282c34;
            --code-text: #e0e0e0;
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --border: #333;
            --accent: #4fc3f7;
            --fg2: #b0b0b0;
            --fg3: #777;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { font-family: monospace; font-size: 32px; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .post-node { margin-bottom: 20px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--fg3); }
        .post-author { font-weight: bold; color: var(--text); }
        .post-subject { font-size: 18px; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .post-preview { font-size: 15px; line-height: 1.6; color: var(--fg2); }
        .post-full { display: none; font-size: 15px; line-height: 1.6; color: var(--fg2); }
        .post-full h1 { font-size: 24px; margin-top: 0; color: var(--text); }
        .post-full h2 { font-size: 20px; margin-top: 20px; color: var(--text); }
        .post-full h3 { font-size: 18px; margin-top: 15px; color: var(--text); }
        .post-full p { margin: 10px 0; }
        .post-full ul, .post-full ol { margin: 10px 0; padding-left: 20px; }
        .post-full a { color: var(--accent); font-weight: bold; }
        
        
        .post-full blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: var(--fg3); margin: 10px 0; }
        .toggle-btn { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: bold; cursor: pointer; text-decoration: none; }
        mark { background: #ffeb3b; color: #000; padding: 0 2px; border-radius: 2px; }
        #theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 9999; font-size: 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 50%; width: 45px; height: 45px; display: none !important; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        #theme-toggle:hover { transform: scale(1.1); }
    
        .post-full pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .post-full code {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .post-full pre code {
            background: transparent;
            padding: 0;
        }

    </style>
</head>
<body>
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="container">
        <div class="header">Блог</div>
        <input type="text" id="search-input" placeholder="🔍 Поиск..." style="width:100%; padding:15px; border:1px solid var(--border); border-radius:10px; font-size:16px; margin-bottom:20px; box-sizing:border-box; background:var(--card-bg); color:var(--text);">
        <div id="feed"><p>Загрузка...</p></div>
    </div>

    <script>
        // Тема (синхронизация с основным сайтом через localStorage, ключ 'theme')
        var currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('theme-toggle').textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // Слушаем изменения из других вкладок/страниц
        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') {
                var newTheme = e.newValue || 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                document.getElementById('theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
            }
        });

        let allNodes = [];
        let query = '';

        fetch('./tree.json').then(r => r.json()).then(data => {
            allNodes = data;
            render(data);
        }).catch(err => {
            document.getElementById('feed').innerHTML = '<p style="color:red;">Ошибка: ' + err.message + '</p>';
        });

        function render(nodes) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            if (nodes.length === 0) {
                feed.innerHTML = '<p>Ничего не найдено.</p>';
                return;
            }
            nodes.forEach((node, idx) => {
                const div = document.createElement('div');
                div.className = 'post-node';
                div.id = 'post-' + idx;

                const preview = (node.body || '').substring(0, 200) + '...';
                let fullHtml = node.body || '';
                if (typeof marked !== 'undefined') {
                    fullHtml = marked.parse(fullHtml);
                }

                div.innerHTML = `
                    <div class="post-header">
                        <span class="post-author">${node.from}</span>
                        <span>${node.date}</span>
                    </div>
                    <div class="post-subject">${highlight(node.subject, query)}</div>
                    <div class="post-preview" id="preview-${idx}">${highlight(preview, query)}</div>
                    <div class="post-full" id="full-${idx}">${fullHtml}</div>
                    <a href="#" class="toggle-btn" id="btn-${idx}" onclick="togglePost(event, ${idx})">Читать полностью →</a>
                `;
                feed.appendChild(div);
            });
        }

        function togglePost(e, idx) {
            e.preventDefault();
            const preview = document.getElementById('preview-' + idx);
            const full = document.getElementById('full-' + idx);
            const btn = document.getElementById('btn-' + idx);

            if (full.style.display === 'block') {
                full.style.display = 'none';
                preview.style.display = 'block';
                btn.textContent = 'Читать полностью →';
            } else {
                full.style.display = 'block';
                preview.style.display = 'none';
                btn.textContent = '← К списку статей';
            }
        }

        function highlight(text, q) {
            if (!q) return text;
            const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp('(' + safeQ + ')', 'gi'), '<mark>$1</mark>');
        }

        document.getElementById('search-input').addEventListener('input', function(e) {
            query = e.target.value.trim();
            if (!query) {
                render(allNodes);
                return;
            }
            const filtered = allNodes.filter(n =>
                (n.subject || '').toLowerCase().includes(query.toLowerCase()) ||
                (n.body || '').toLowerCase().includes(query.toLowerCase())
            );
            render(filtered);
        });
    </script>
</body>
</html>
